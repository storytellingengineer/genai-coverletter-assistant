<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenAI Cover Letter Assistant</title><style>body{font-family:Inter,system-ui;max-width:850px;margin:40px auto;padding:0 18px;background:#f7f8fb;color:#172033}main{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}input,textarea,select,button{width:100%;padding:12px;margin:7px 0 14px;box-sizing:border-box;border:1px solid #ccd2df;border-radius:9px;font:inherit}button{background:#172033;color:white;cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}#result{white-space:pre-wrap;background:#f2f4f8;padding:18px;border-radius:10px;min-height:180px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>GenAI Cover Letter Assistant</h1><p>Generate a tailored cover letter from your resume and a job description.</p><label>Render API URL</label><input id="api" value="https://genai-coverletter-api.onrender.com" placeholder="https://your-service.onrender.com"/><div class="grid"><div><label>Company</label><input id="company" required></div><div><label>Role</label><input id="role" required></div></div><label>Tone</label><select id="tone"><option>Professional</option><option>Conversational</option><option>Concise</option></select><label>Resume (PDF)</label><input id="resume" type="file" accept="application/pdf" required><label>Job description</label><textarea id="jd" rows="9" required></textarea><button id="go">Generate cover letter</button><h2>Result</h2><div id="result">Your generated letter will appear here.</div><button id="copy">Copy letter</button></main><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{const f=$('resume').files[0];if(!f||!$('jd').value||!$('company').value||!$('role').value||!$('api').value){$('result').textContent='Please complete all fields, including the Render API URL.';return}const d=new FormData();d.append('resume',f);d.append('job_description',$('jd').value);d.append('company',$('company').value);d.append('role',$('role').value);d.append('tone',$('tone').value);$('result').textContent='Generating…';try{const r=await fetch($('api').value.replace(/\/$/,'')+'/api/generate',{method:'POST',body:d});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');$('result').textContent=j.letter+'\n\n[Provider: '+j.provider+']'}catch(e){$('result').textContent='Error: '+e.message}};$('copy').onclick=()=>navigator.clipboard.writeText($('result').textContent);</script></body></html>
